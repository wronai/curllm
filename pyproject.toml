[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curllm"
version = "1.0.43"
description = "curllm - Intelligent browser automation with local LLMs (Qwen, Llama, Mistral) for data extraction and form automation using a dynamic LLM-DSL architecture without hardcoded selectors."
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Tom Sapletta" },
  {name = "Tom Sapletta",email = "tom@sapletta.com"}
]
requires-python = ">=3.10"
keywords = ["llm", "browser", "automation", "scraping", "ollama", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
dependencies = [
  "flask",
  "flask-cors",
  "aiohttp",
  "playwright",
  "langchain-ollama",
  "litellm>=1.0.0",
  "pillow",
  "opencv-python",
  "pytesseract",
  "numpy",
  "websockets",
  "requests",
  "python-dotenv",
  "psutil",
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/wronai/curllm"
Issues = "https://github.com/wronai/curllm/issues"

[project.optional-dependencies]
mcp = [
  "mcp>=1.0.0",
]
testql = [
  "testql>=1.2.64; python_version >= '3.11' and python_version < '3.14'",
]
browser = [
  "testql>=1.2.64; python_version >= '3.11' and python_version < '3.14'",
  "playwright>=1.40.0",
]

[project.scripts]
curllm-setup = "curllm_core.cli.setup:main"
curllm-doctor = "curllm_core.cli.doctor:main"
curllm-web = "curllm_core.cli.web:main"
curllm-flow = "curllm_core.cli.flow:main"
curllm-feedback = "curllm_core.cli.feedback:main"
curllm-mcp = "curllm_mcp.server:main"

[tool.setuptools]
# Install non-Python CLI script and top-level modules
script-files = ["curllm"]
py-modules = ["curllm_server", "bql_parser", "curllm_web"]

[tool.setuptools.packages.find]
include = ["curllm_core*", "curllm_logs*", "curllm_mcp*", "functions*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async",
    "slow: mark test as slow running",
]
# curlx_pkg is an independent sub-project with its own pyproject.toml and
# .venv (its own `curlx` package installed only there). Collecting its
# tests from the root pytest run fails collection for the *entire* suite
# with ModuleNotFoundError: No module named 'curlx', since `curlx` is never
# installed in the root venv. Run curlx_pkg's own tests from within
# curlx_pkg using its own .venv instead.
norecursedirs = ["curlx_pkg", ".venv", "venv", "node_modules", "build", "dist"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/deep/deep-v4-pro"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/deep/deep-v4-pro"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]
